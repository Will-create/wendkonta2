<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#733686"><title>SalePro POS — Offline</title>
<style>body{margin:0;padding:24px;min-height:80vh;display:grid;place-items:center;background:#f5f4f8;color:#262231;font:18px/1.6 system-ui,sans-serif}main{max-width:32rem;background:white;padding:28px;border-radius:18px}button,a{display:inline-block;padding:12px 20px;background:#733686;color:white;border:0;border-radius:8px;font:inherit;text-decoration:none}p{overflow-wrap:anywhere}</style></head>
<body><main><h1>SalePro POS</h1><h2 id="title">You are offline</h2><p id="message">Connect to continue. Sales, payments, purchases and stock changes require a connection. No transaction has been queued.</p><button id="retry" type="button">Try again</button><p><a id="home" href="/dashboard">Dashboard</a></p></main>
<script>const language=(navigator.language||'en').slice(0,2);const text={fr:['Vous êtes hors ligne','Connectez-vous pour continuer. Les ventes, paiements, achats et mouvements de stock nécessitent une connexion. Aucune opération n’a été mise en attente.','Réessayer','Accueil'],ar:['أنت غير متصل','اتصل للمتابعة. تتطلب المبيعات والمدفوعات والمشتريات وتغييرات المخزون اتصالاً. لم تتم جدولة أي معاملة.','إعادة المحاولة','الرئيسية']}[language];if(text){document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';['title','message','retry','home'].forEach((id,i)=>document.getElementById(id).textContent=text[i]);}document.getElementById('retry').addEventListener('click',()=>location.reload());</script></body></html>
