server {
    listen 80;
    listen [::]:80;
    server_name wendkonta.logicielyaar.site;

    location ^~ /.well-known/acme-challenge/ {
        root /www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://wendkonta.logicielyaar.site$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wendkonta.logicielyaar.site;
    ssl_certificate /etc/letsencrypt/live/wendkonta.logicielyaar.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wendkonta.logicielyaar.site/privkey.pem;

    root /www/www/logicielyaar_site-wendkonta/public;
    index index.php;
    client_max_body_size 24M;
    access_log /www/logs/wendkonta.access.log;
    error_log /www/logs/wendkonta.error.log;

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* ^/(?:migrate|clear|install)(?:/|$) {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location ~* \.(?:sql|log|bak|env|ini|lock|ya?ml)$ {
        return 404;
    }

    location = /index.php {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:19083;
        fastcgi_read_timeout 120s;
    }

    location ~* \.php(?:/|$) {
        return 404;
    }

    location / {
        if (-f $document_root/../storage/framework/down) { return 503; }
        try_files $uri $uri/ /index.php?$query_string;
    }
}
